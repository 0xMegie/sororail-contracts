[package]
name = "sororail-recurring"
description = "Soroban recurring authorization: pull-based subscription charges within a payer-set cap and cadence."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
build = "build.rs"

[dependencies]
soroban-sdk = { workspace = true }
sororail-common = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sororail-common = { workspace = true, features = ["testutils"] }

[lints]
workspace = true
